# Release：打 tag 自动打包并发布
#
# 触发：push tag vX.Y.Z
# 流程：PyInstaller 打包 sidecar -> Tauri 构建 NSIS 安装包 -> 上传 GitHub Release
#
# 设计要点：
#   - 仅 tag 触发，push 到 master 不打包
#   - Windows runner（Tauri + PyInstaller 仅 Windows）
#   - 从 tag 名解析版本号，注入各配置文件中
#   - 需要安装 Rust、Node.js、Python 以完成完整构建

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write  # 创建 Release 需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 升级 npm（修复 optional 原生绑定缺失）
        # Vite 7 要求 Node 20.19+ / 22.12+，Node 22 满足要求；
        # Node 自带 npm 10 存在 optional 依赖不安装的 bug（npm/cli#4828），
        # 会导致 @tailwindcss/oxide 的原生绑定（如 win32-x64-msvc）丢失而构建失败
        run: npm install -g npm@11

      - name: 安装 Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: 解析 tag 版本号
        # v0.3.0 -> 0.3.0（去掉 v 前缀）
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $VERSION"

      - name: 验证版本号一致性
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "验证版本号与 tag 一致性..."
          python scripts/sync_version.py validate-tag "$TAG"

      - name: 注入版本号到源码文件
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "正在将版本号 $VERSION 注入各源码文件..."
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" frontend/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" frontend/package.json
          sed -i "s/^version = \"[0-9.]*\"/version = \"$VERSION\"/" frontend/src-tauri/Cargo.toml
          sed -i "s/version = \"[0-9.]*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/version=\"[0-9.]*\"/version=\"$VERSION\"/" backend/app.py
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" backend/api/health.py
          echo "版本号注入完成"

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 下载 FFmpeg 静态二进制
        shell: bash
        run: |
          python scripts/download_ffmpeg.py

      - name: PyInstaller 打包 sidecar
        run: |
          pyinstaller --onefile --name backend-sidecar --distpath frontend/src-tauri/binaries --add-data "backend;backend" --add-data "app;app" --add-data "crawlers;crawlers" --add-data "downloader;downloader" --add-data "resources/ffmpeg/ffmpeg.exe;." --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.loops.asyncio --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.http.h11_impl --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.protocols.websockets.wsproto_impl --hidden-import uvicorn.lifespan.on --hidden-import starlette.middleware.cors --hidden-import databases --hidden-import sqlalchemy --hidden-import httpx --hidden-import httpcore --hidden-import anyio --hidden-import sniffio --exclude-module tkinter --exclude-module PyQt5 --exclude-module PySide6 --exclude-module matplotlib --exclude-module numpy --exclude-module pandas --exclude-module PIL --console sidecar_launcher.py

      - name: 重命名 sidecar（添加平台 triple）
        shell: bash
        run: |
          mv frontend/src-tauri/binaries/backend-sidecar.exe "frontend/src-tauri/binaries/backend-sidecar-x86_64-pc-windows-msvc.exe"

      - name: 校验 sidecar 产物
        shell: bash
        run: |
          test -f "frontend/src-tauri/binaries/backend-sidecar-x86_64-pc-windows-msvc.exe" || { echo "缺失 sidecar 二进制"; exit 1; }
          echo "Sidecar 打包校验通过"

      - name: 构建 Tauri 安装包
        shell: bash
        run: |
          cd frontend
          npm run tauri build -- --bundles nsis

      - name: 校验安装包产物
        shell: bash
        run: |
          SETUP="frontend/src-tauri/target/release/bundle/nsis/撷风拾影_${{ steps.version.outputs.version }}_x64-setup.exe"
          test -f "$SETUP" || { echo "缺失安装包: $SETUP"; exit 1; }
          echo "安装包校验通过: $SETUP"
          echo "安装包大小: $(ls -lh "$SETUP" | awk '{print $5}')"

      - name: 创建 GitHub Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            frontend/src-tauri/target/release/bundle/nsis/撷风拾影_${{ steps.version.outputs.version }}_x64-setup.exe
            frontend/src-tauri/binaries/backend-sidecar-x86_64-pc-windows-msvc.exe
          generate_release_notes: true