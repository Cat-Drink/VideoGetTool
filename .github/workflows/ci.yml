# CI：代码质量与单元测试
#
# 触发：push 到 master / PR 到 master
# 内容：ruff 检查 + black 格式校验 + 前端 TypeScript 检查 + 单元测试 + 覆盖率
#
# 设计要点：
#   - Python 3.11 单版本（pyproject.toml requires-python >=3.11）
#   - windows-latest runner
#   - 用 -o addopts="" 清空 pyproject.toml 的 addopts，
#     覆盖率由命令行显式传参
#   - Codecov tokenless 上传（公开仓库，无需配 secret）

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同分支并发推送时取消旧的任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    # Gitleaks 步骤在 Linux 无 Windows 包 404 问题（gitleaks 跨平台），
    # 故本 job 运行于 ubuntu-latest。
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 审计 S5：secrets 硬编码扫描（gitleaks，含历史提交）
      # 注：固定官方稳定版 v2.3.1（禁止裸 @v2）；该 action 不支持
      # gitleaks-version 输入（会被丢弃），因此不设 with，由 action 自动
      # 选择版本 —— Linux runner 各版本均有 linux_x64.tar.gz 资产，无 404。
      # 不设置 ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION。
      - name: Gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 审计 S5：Python 依赖漏洞审计。
      # 注：pip-audit 先以 continue-on-error 运行 —— 待基线清零后再收紧为硬门禁。
      - name: pip-audit 依赖漏洞审计
        continue-on-error: true
        run: pip-audit

      - name: Ruff 检查
        run: ruff check .

      - name: Black 格式校验
        run: black --check .

      - name: 单元测试
        # -o addopts="" 清空 pyproject.toml 的 addopts（含 --cov-fail-under=80），
        # 覆盖率参数由命令行显式传入
        shell: bash
        run: |
          pytest tests/ \
            -o addopts="" \
            --cov=. --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-check:
    name: Frontend TypeScript Check
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 升级 npm（修复 optional 原生绑定缺失）
        # Vite 7 要求 Node 20.19+ / 22.12+，Node 22 满足要求；
        # Node 自带 npm 10 存在 optional 依赖不安装的 bug（npm/cli#4828），
        # 会导致 @tailwindcss/oxide 的原生绑定（如 win32-x64-msvc）丢失而构建失败
        run: npm install -g npm@11

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: TypeScript 类型检查
        run: |
          cd frontend
          npx tsc --noEmit

      # 审计 S5：前端依赖漏洞审计。
      # 注：npm audit 命中本地镜像缺陷（registry 不支持 audit 端点）时可能失败，
      # 以 continue-on-error 运行避免阻塞主流程；CI 走默认 registry 时正常生效。
      - name: npm audit 漏洞审计
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: 前端构建
        run: |
          cd frontend
          npm run build