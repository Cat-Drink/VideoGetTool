[project]
name = "video-get-tool"
version = "0.3.3"
description = "抖音短视频（含图文、长视频）数据抓取的 Windows 桌面端应用"
authors = [{ name = "VideoGetTool Contributors" }]
# v0.3.0 起：项目协议由 MIT 切换为 Apache License 2.0
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors
# F: pyflakes
# W: pycodestyle warnings
# I: isort
# UP: pyupgrade
# B: flake8-bugbear
# SIM: flake8-simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # 测试中允许 assert
"*.spec" = ["F821", "UP009"]  # PyInstaller spec 文件的全局变量与编码声明
"backend/app.py" = ["E402"]  # 需先 sys.path.insert 再 import（PyInstaller sidecar 打包要求）

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=80"
markers = [
    "signer: 签名算法模块测试（crawlers/signer/）",
    "integration: 集成测试（需真实 Cookie，CI 默认跳过）",
    "full_chain: 全链路集成测试（从 URL 解析到文件下载）",
    "slow: 耗时较长的性能测试（可选运行）",
    "bilibili: B 站（Bilibili）爬虫模块测试（crawlers/bilibili/）",
]

[tool.coverage.run]
source = ["app", "crawlers", "downloader", "worker"]
omit = [
    "tests/*",
    "ui/*",
    "main.py",
    "sidecar_launcher.py",
    "scripts/*",
    "crawlers/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
